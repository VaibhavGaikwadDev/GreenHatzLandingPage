<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Green Hatz - Innovative Solutions</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Google Fonts (Poppins) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Spline Viewer -->
    <script
      type="module"
      src="https://unpkg.com/@splinetool/viewer@1.9.89/build/spline-viewer.js"
    ></script>

    <!-- Custom Styles -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000000; /* Solid black background */
        font-family: 'Poppins', sans-serif;
        overflow-x: hidden;
        color: #ffffff;
      }

      /* Glassmorphism Navbar */
      .glass-nav {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        border-radius: 1.5rem; /* Smooth, elegant rounded corners */
      }

      /* Spline Viewer */
      spline-viewer {
        position: absolute;
        bottom: 0;
        right: -20%;
        aspect-ratio: 5 / 3;
        z-index: 10;
      }

      @media (max-width: 768px) {
        spline-viewer {
          width: 90vw;
          aspect-ratio: 1.5 / 1;
          right: 0;
        }
      }

      /* Hero Section */
      .hero-text h1 {
        font-size: 4rem; /* Large, impactful title */
        font-weight: 800;
        color: #00ff88; /* Vibrant green for brand consistency */
        text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        line-height: 1.1;
      }

      .hero-text h2 {
        font-size: 2rem; /* Subheading size */
        font-weight: 600;
        color: #ffffff;
        opacity: 0.9;
        margin: 1rem 0;
      }

      .hero-text p {
        font-size: 1.25rem; /* Readable paragraph */
        color: #e0e0e0;
        max-width: 600px;
        margin-bottom: 2rem;
      }

      .hero-text .keyword {
        display: inline-block;
        font-size: 2.5rem; /* Slightly smaller than title */
        font-weight: 700;
        color: #ffffff;
        margin: 0.5rem 1rem 0.5rem 0;
        opacity: 0; /* Start invisible for animation */
        transition: all 0.3s ease; /* Smooth hover effect */
      }

      .hero-text .keyword:hover {
        transform: translateY(-5px); /* Lift on hover */
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      }

      /* CTA Button */
      .cta-button {
        background: linear-gradient(90deg, #00ff88, #00cc66);
        padding: 0.75rem 2rem;
        border-radius: 9999px; /* Fully rounded */
        font-weight: 600;
        font-size: 1.125rem;
        color: #000;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .cta-button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive Adjustments */
      @media (max-width: 1024px) {
        .hero-text h1 {
          font-size: 3rem;
        }
        .hero-text h2 {
          font-size: 1.75rem;
        }
        .hero-text .keyword {
          font-size: 2rem;
        }
        .hero-text p {
          font-size: 1.125rem;
        }
      }

      @media (max-width: 768px) {
        .hero-text {
          padding: 0 1.5rem;
        }
        .hero-text h1 {
          font-size: 2.5rem;
        }
        .hero-text h2 {
          font-size: 1.5rem;
        }
        .hero-text .keyword {
          font-size: 1.75rem;
        }
        .hero-text p {
          font-size: 1rem;
        }
        .absolute.left-10 {
          left: 0;
        }
      }

      @media (max-width: 480px) {
        .hero-text h1 {
          font-size: 2rem;
        }
        .hero-text h2 {
          font-size: 1.25rem;
        }
        .hero-text .keyword {
          font-size: 1.5rem;
        }
        .cta-button {
          padding: 0.5rem 1.5rem;
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Glassmorphism Navbar -->
    <nav
      class="glass-nav mx-4 my-4 px-6 py-4 flex flex-wrap items-center justify-between z-20 relative"
      data-aos="fade-down"
      data-aos-duration="1000"
    >
      <div class="text-3xl font-bold text-white">Team Green Hatz</div>
      <div class="space-x-6 text-lg">
        <a
          href="#"
          class="text-white hover:text-green-300 transition duration-300"
          >Home</a
        >
        <a
          href="#"
          class="text-white hover:text-green-300 transition duration-300"
          >About</a
        >
        <a
          href="#"
          class="text-white hover:text-green-300 transition duration-300"
          >Contact</a
        >
      </div>
    </nav>

    <!-- Spline Viewer -->
    <spline-viewer
      url="https://prod.spline.design/AX2hpnw7ZhXqsh67/scene.splinecode"
    ></spline-viewer>

    <!-- Hero Section -->
    <div
      class="absolute top-1/2 left-10 transform -translate-y-1/2 z-30 hero-text"
    >
      <h1 data-aos="fade-right" data-aos-duration="1000">
        Team Green Hatz
      </h1>
      <h2 data-aos="fade-right" data-aos-delay="200" data-aos-duration="1000">
        Pioneering the Future
      </h2>
      <p data-aos="fade-up" data-aos-delay="400" data-aos-duration="1000">
        At Team Green Hatz, we create innovative solutions that inspire change and
        drive progress. Join us in shaping a sustainable, tech-driven future.
      </p>
      <div data-aos="fade-up" data-aos-delay="600" data-aos-duration="1000">
        <span class="keyword">Imagine</span>
        <span class="keyword" data-aos-delay="800">Innovate</span>
        <span class="keyword" data-aos-delay="1000">Inspire</span>
      </div>
      <a
        href="#"
        class="cta-button inline-block mt-6"
        data-aos="zoom-in"
        data-aos-delay="1200"
        data-aos-duration="1000"
        >Submit Your Idea</a
      >
    </div>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      // Initialize AOS
      AOS.init({
        once: true, // Animation happens only once
        offset: 100, // Trigger 100px before element is in view
      });
    </script>
  </body>
</html>
